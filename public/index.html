<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand-badge">URL Shortener Assignment</div>
      <h1 class="app-title">Mini URL Shortener</h1>
      <p class="app-subtitle">Paste your long link below to get a clean, instant short URL with real-time click tracking.</p>
    </header>

    <main class="main-card">
      <form id="shortenForm" class="shorten-form" novalidate>
        <div class="input-group">
          <label for="urlInput" class="visually-hidden">Long URL to shorten</label>
          <div class="input-wrapper">
            <svg class="link-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <input 
              type="url" 
              id="urlInput" 
              name="url" 
              placeholder="https://example.com/very-long-url-path..." 
              autocomplete="off" 
              required
            />
          </div>
          <button type="submit" id="submitBtn" class="btn-primary">
            <span class="btn-text">Shorten URL</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </div>
        <div id="errorMessage" class="error-banner" role="alert" style="display: none;"></div>
      </form>

      <!-- Latest Result Card -->
      <section id="resultSection" class="result-card" style="display: none;" aria-live="polite">
        <div class="result-header">
          <span class="badge-success">Short Link Created</span>
          <div class="stats-badge" id="clickStatsBadge">
            <span class="stats-label">Clicks:</span>
            <span class="stats-count" id="clickCount">0</span>
            <button id="refreshStatsBtn" class="btn-icon" title="Refresh click count" aria-label="Refresh clicks">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                <path d="M3 21v-5h5"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="short-url-row">
          <input type="text" id="shortUrlOutput" readonly class="short-url-input" />
          <button type="button" id="copyBtn" class="btn-copy">
            <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copyBtnText">Copy</span>
          </button>
          <a id="testLinkBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn-visit" title="Open and test redirect">
            Visit ↗
          </a>
        </div>

        <div class="original-url-preview">
          <span class="preview-label">Original:</span>
          <span id="originalUrlDisplay" class="preview-url"></span>
        </div>
      </section>
    </main>

    <!-- Recent Links Section (Persists Across Page Reloads) -->
    <section id="recentSection" class="recent-card" style="display: none;">
      <div class="recent-header">
        <h2 class="recent-title">Your Shortened Links</h2>
        <button id="clearRecentBtn" class="btn-clear" title="Clear saved links">Clear All</button>
      </div>
      <div id="recentList" class="recent-list"></div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
